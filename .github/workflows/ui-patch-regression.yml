name: Yav UI patch regression

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    if: github.head_ref == 'qa/ui-full-chain-2.0.0'
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml playwright pyinstaller
      - name: Compile Python
        run: python -m compileall backend tests yav_v2.py qa
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check JavaScript syntax
        run: |
          node --check backend/static/app.js
          node --check backend/static/accessibility.js
          node --check qa/ui_full_chain.spec.js
      - name: Check whitespace
        run: git diff --check

  windows-package:
    if: github.head_ref == 'qa/ui-full-chain-2.0.0'
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml playwright pyinstaller
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean yav_v2.spec
      - name: Start packaged Yav and verify patched assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $report = Join-Path $env:RUNNER_TEMP 'ui-patch-package-report.txt'
          $exe = (Resolve-Path 'dist\Yav-V2.exe').Path
          $data = Join-Path $env:RUNNER_TEMP 'yav-ui-patch-package'
          $port = 18765
          $server = $null

          function Report([string]$text) {
            $line = "$(Get-Date -Format o) $text"
            Write-Host $line
            Add-Content $report $line
          }
          function Start-Yav([string[]]$arguments) {
            $info = [Diagnostics.ProcessStartInfo]::new()
            $info.FileName = $exe
            foreach ($argument in $arguments) { [void]$info.ArgumentList.Add($argument) }
            $info.UseShellExecute = $false
            $info.CreateNoWindow = $true
            $process = [Diagnostics.Process]::new()
            $process.StartInfo = $info
            if (-not $process.Start()) { throw 'Process.Start returned false' }
            return $process
          }
          function Run-Yav([string[]]$arguments) {
            $process = Start-Yav $arguments
            if (-not $process.WaitForExit(60000)) {
              $process.Kill($true)
              throw "Yav command timeout: $($arguments -join ' ')"
            }
            if ($process.ExitCode -ne 0) { throw "Yav command exit $($process.ExitCode)" }
          }

          Remove-Item $data -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $report -Force -ErrorAction SilentlyContinue
          try {
            Report 'STAGE=start'
            $server = Start-Yav @('--data-dir', $data, '--port', "$port", '--no-browser')
            $deadline = [DateTime]::UtcNow.AddSeconds(45)
            $status = $null
            do {
              try {
                $status = Invoke-RestMethod "http://127.0.0.1:$port/api/app/status" -TimeoutSec 2
                if ($status.app -eq 'Yav') { break }
              } catch {}
              Start-Sleep -Milliseconds 250
            } while ([DateTime]::UtcNow -lt $deadline)
            if (-not $status -or $status.app -ne 'Yav') { throw 'Packaged Yav did not become ready' }
            Report "READY version=$($status.version) pid=$($status.pid)"

            Report 'STAGE=assets'
            $homepage = (Invoke-WebRequest "http://127.0.0.1:$port/" -UseBasicParsing).Content
            if ($homepage -notmatch '/assets/accessibility.css' -or $homepage -notmatch '/assets/accessibility.js') {
              throw 'Patched UI assets are not referenced by the packaged homepage'
            }
            foreach ($asset in @('accessibility.css', 'accessibility.js')) {
              $response = Invoke-WebRequest "http://127.0.0.1:$port/assets/$asset" -UseBasicParsing
              if ($response.StatusCode -ne 200 -or -not $response.Content) { throw "Missing packaged asset: $asset" }
              Report "ASSET=$asset bytes=$($response.RawContentLength)"
            }

            Report 'STAGE=shutdown'
            Run-Yav @('--data-dir', $data, '--shutdown')
            if (-not $server.WaitForExit(30000)) { throw 'Packaged service process did not exit' }
            $client = [Net.Sockets.TcpClient]::new()
            try {
              $client.Connect('127.0.0.1', $port)
              throw 'Port remained open after shutdown'
            } catch [Net.Sockets.SocketException] {
              Report 'PORT_CLOSED=true'
            } finally {
              $client.Dispose()
            }
            Report 'PACKAGE_UI_PATCH_SUCCESS'
          } catch {
            Report "FAILURE type=$($_.Exception.GetType().FullName) message=$($_.Exception.Message)"
            $log = Join-Path $data 'logs\yav.log'
            if (Test-Path $log) {
              Add-Content $report '--- YAV LOG ---'
              Get-Content $log | Add-Content $report
            }
            throw
          } finally {
            if ($server -and -not $server.HasExited) { $server.Kill($true) }
          }
      - name: Record package hash
        if: always()
        shell: pwsh
        run: |
          if (Test-Path 'dist\Yav-V2.exe') {
            Get-Item 'dist\Yav-V2.exe' | Select-Object FullName,Length
            Get-FileHash 'dist\Yav-V2.exe' -Algorithm SHA256
          }
      - name: Upload package smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yav-ui-patch-package-report
          path: |
            ${{ runner.temp }}/ui-patch-package-report.txt
            ${{ runner.temp }}/yav-ui-patch-package/logs/
          if-no-files-found: warn
          retention-days: 7
