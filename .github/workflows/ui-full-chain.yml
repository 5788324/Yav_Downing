name: Yav 2.0.0 UI full-chain audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ui-audit:
    if: github.head_ref == 'qa/ui-full-chain-2.0.0'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend and browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml playwright
          npm install --no-save @playwright/test@1.54.1 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium

      - name: Create deterministic UI fixture
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python qa/ui_seed.py "$RUNNER_TEMP/yav-ui-data" 2>&1 | tee "$RUNNER_TEMP/yav-ui-seed.log"

      - name: Start Yav source server
        run: |
          python -m backend.app --data-dir "$RUNNER_TEMP/yav-ui-data" --port 18765 > "$RUNNER_TEMP/yav-ui-server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/yav-ui-server.pid"
          for attempt in $(seq 1 80); do
            if curl --fail --silent http://127.0.0.1:18765/api/app/status > /dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat "$RUNNER_TEMP/yav-ui-server.log"
          exit 1

      - name: Synchronize exhaustive browser audit
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('qa/ui_full_chain.spec.js')
          text = path.read_text(encoding='utf-8')

          card_old = """    const ids = await page.locator('.movie-card').evaluateAll(cards => cards.map(card => card.dataset.id));"""
          card_new = """    await expect(page.locator('#movieGrid .movie-card')).toHaveCount(pageNumber === 1 ? 72 : 11, { timeout: 15000 });
              const ids = await page.locator('.movie-card').evaluateAll(cards => cards.map(card => card.dataset.id));"""
          if card_old not in text:
              raise SystemExit('card synchronization target not found')
          text = text.replace(card_old, card_new, 1)

          error_old = """    if (!shuttingDown && url.startsWith(BASE_URL) && !url.includes('missing-poster')) {
              runtimeErrors.push({ type: 'requestfailed', url, error: request.failure()?.errorText || '' });
            }"""
          error_new = """    const errorText = request.failure()?.errorText || '';
              const expectedCoverAbort = /\\/api\\/movies\\/\\d+\\/cover$/.test(new URL(url).pathname) && errorText.includes('ERR_ABORTED');
              if (!shuttingDown && url.startsWith(BASE_URL) && !expectedCoverAbort) {
                runtimeErrors.push({ type: 'requestfailed', url, error: errorText });
              }"""
          if error_old not in text:
              raise SystemExit('request failure filter target not found')
          text = text.replace(error_old, error_new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Run every-control Playwright audit
        env:
          BASE_URL: http://127.0.0.1:18765
        run: npx playwright test qa/ui_full_chain.spec.js --workers=1 --reporter=line,html

      - name: Upload screenshots, coverage and browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yav-2.0.0-ui-full-chain
          path: |
            test-results/ui-audit/
            playwright-report/
            test-results/
            ${{ runner.temp }}/yav-ui-seed.log
            ${{ runner.temp }}/yav-ui-server.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop remaining server process
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/yav-ui-server.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/yav-ui-server.pid")" 2>/dev/null || true
          fi
