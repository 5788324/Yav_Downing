name: Release Yav 2.0.1

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-yav-2.0.1
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'pull_request' || github.head_ref == 'release-trigger-v2.0.1'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Check release state
        id: state
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "from backend.runtime import APP_VERSION; print(APP_VERSION)"
          if ($version -ne '2.0.1') { throw "Expected APP_VERSION 2.0.1, got $version" }
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $exists = $false
          try {
            Invoke-RestMethod "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/v2.0.1" -Headers $headers | Out-Null
            $exists = $true
          } catch {
            $statusCode = [int]$_.Exception.Response.StatusCode
            if ($statusCode -ne 404) { throw }
          }
          "exists=$($exists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Verify existing release assets
        if: steps.state.outputs.exists == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'yav-v2.0.1-verify'
          New-Item $root -ItemType Directory -Force | Out-Null
          gh release download v2.0.1 `
            --repo $env:GITHUB_REPOSITORY `
            --pattern 'Yav-V2.exe' `
            --pattern 'SHA256SUMS.txt' `
            --dir $root `
            --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset download failed' }
          $exe = Join-Path $root 'Yav-V2.exe'
          $sums = Join-Path $root 'SHA256SUMS.txt'
          $expected = ((Get-Content $sums -Raw).Trim() -split '\s+')[0].ToUpperInvariant()
          $actual = (Get-FileHash $exe -Algorithm SHA256).Hash.ToUpperInvariant()
          $size = (Get-Item $exe).Length
          if ($actual -ne $expected) { throw "Checksum mismatch: expected $expected actual $actual" }
          Write-Host "OFFICIAL_SIZE=$size"
          Write-Host "OFFICIAL_SHA256=$actual"
          "## Yav 2.0.1 official assets`n- Size: $size bytes`n- SHA-256: $actual" >> $env:GITHUB_STEP_SUMMARY

      - name: Install dependencies
        if: steps.state.outputs.exists != 'true'
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml playwright pyinstaller

      - name: Run release tests
        if: steps.state.outputs.exists != 'true'
        run: |
          python -m compileall backend tests yav_v2.py qa
          python -m unittest discover -s tests -v
          node --check backend/static/app.js
          node --check backend/static/accessibility.js
          git diff --check

      - name: Build Windows executable
        if: steps.state.outputs.exists != 'true'
        run: python -m PyInstaller --noconfirm --clean yav_v2.spec

      - name: Smoke-test packaged executable
        if: steps.state.outputs.exists != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'dist\Yav-V2.exe').Path
          $data = Join-Path $env:RUNNER_TEMP 'yav-v2.0.1-release'
          $port = 18765
          $server = $null

          function Start-Yav([string[]]$arguments) {
            $info = [Diagnostics.ProcessStartInfo]::new()
            $info.FileName = $exe
            foreach ($argument in $arguments) { [void]$info.ArgumentList.Add($argument) }
            $info.UseShellExecute = $false
            $info.CreateNoWindow = $true
            $process = [Diagnostics.Process]::new()
            $process.StartInfo = $info
            if (-not $process.Start()) { throw 'Process.Start returned false' }
            return $process
          }
          function Run-Yav([string[]]$arguments) {
            $process = Start-Yav $arguments
            if (-not $process.WaitForExit(60000)) {
              $process.Kill($true)
              throw "Yav command timeout: $($arguments -join ' ')"
            }
            if ($process.ExitCode -ne 0) { throw "Yav command exit $($process.ExitCode)" }
          }

          Remove-Item $data -Recurse -Force -ErrorAction SilentlyContinue
          try {
            $server = Start-Yav @('--data-dir', $data, '--port', "$port", '--no-browser')
            $deadline = [DateTime]::UtcNow.AddSeconds(45)
            $status = $null
            do {
              try {
                $status = Invoke-RestMethod "http://127.0.0.1:$port/api/app/status" -TimeoutSec 2
                if ($status.app -eq 'Yav') { break }
              } catch {}
              Start-Sleep -Milliseconds 250
            } while ([DateTime]::UtcNow -lt $deadline)
            if (-not $status -or $status.app -ne 'Yav') { throw 'Packaged Yav did not become ready' }
            if ($status.version -ne '2.0.1') { throw "Packaged version mismatch: $($status.version)" }

            $homepage = (Invoke-WebRequest "http://127.0.0.1:$port/" -UseBasicParsing).Content
            if ($homepage -notmatch '/assets/accessibility.css' -or $homepage -notmatch '/assets/accessibility.js') {
              throw 'UI hotfix assets are not referenced by the packaged homepage'
            }
            foreach ($asset in @('accessibility.css', 'accessibility.js')) {
              $response = Invoke-WebRequest "http://127.0.0.1:$port/assets/$asset" -UseBasicParsing
              if ($response.StatusCode -ne 200 -or -not $response.Content) { throw "Missing packaged asset: $asset" }
            }

            Run-Yav @('--data-dir', $data, '--shutdown')
            if (-not $server.WaitForExit(30000)) { throw 'Packaged service did not exit' }
            $client = [Net.Sockets.TcpClient]::new()
            try {
              $client.Connect('127.0.0.1', $port)
              throw 'Port remained open after shutdown'
            } catch [Net.Sockets.SocketException] {
              # Expected.
            } finally {
              $client.Dispose()
            }
          } finally {
            if ($server -and -not $server.HasExited) { $server.Kill($true) }
          }

      - name: Create release assets
        if: steps.state.outputs.exists != 'true'
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'dist\Yav-V2.exe' -Algorithm SHA256).Hash.ToUpperInvariant()
          "$hash  Yav-V2.exe" | Set-Content 'dist\SHA256SUMS.txt' -Encoding ASCII
          Copy-Item 'docs\RELEASE_NOTES_2.0.1.md' 'dist\RELEASE_NOTES_2.0.1.md'
          Get-Item 'dist\Yav-V2.exe' | Select-Object FullName,Length
          Get-Content 'dist\SHA256SUMS.txt'

      - name: Publish GitHub Release
        if: steps.state.outputs.exists != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.0.1 `
            'dist\Yav-V2.exe' `
            'dist\SHA256SUMS.txt' `
            'dist\RELEASE_NOTES_2.0.1.md' `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title 'Yav 2.0.1' `
            --notes-file 'docs\RELEASE_NOTES_2.0.1.md'
