name: Build Yav 2.0.2 RC2 artifact

on:
  pull_request:
    branches:
      - v2-rebuild

permissions:
  contents: read

jobs:
  build-rc2:
    name: Build fixed-source RC2 on Windows
    runs-on: windows-latest
    env:
      SOURCE_SHA: da815c1776486267571667fc9be7888b6a4faa51
      RC_VERSION: 2.0.2
      RC_NAME: Yav-2.0.2-RC2-da815c1-windows-x64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: da815c1776486267571667fc9be7888b6a4faa51

      - name: Verify fixed source commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = git rev-parse HEAD
          Write-Host "FIXED_SOURCE_SHA=$actual"
          if ($actual -ne $env:SOURCE_SHA) { throw "Checkout SHA drifted: $actual" }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build and UI dependencies
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml playwright pyinstaller
          npm install --no-save @playwright/test@1.54.1 @axe-core/playwright@4.10.2
          npx playwright install chromium

      - name: Run Python, Node, JavaScript, and version checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((python -c "from backend.runtime import APP_VERSION; print(APP_VERSION)") -ne $env:RC_VERSION) { throw 'Unexpected app version' }
          python -m compileall backend tests yav_v2.py qa
          python -m unittest discover -s tests -v
          node --check backend/static/app.js
          node --check backend/static/accessibility.js
          node --test tests/test_scan_state.mjs
          git diff --check

      - name: Build fixed-source RC2 executable
        run: python -m PyInstaller --noconfirm --clean yav_v2.spec

      - name: Verify API version, page safe exit, CLI exit, and port release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'dist\Yav-V2.exe').Path
          function Wait-YavReady([int] $port) {
            $deadline = [DateTime]::UtcNow.AddSeconds(45)
            do {
              try { $status = Invoke-RestMethod "http://127.0.0.1:$port/api/app/status" -TimeoutSec 2 } catch { $status = $null }
              if ($status.app -eq 'Yav' -and $status.version -eq $env:RC_VERSION) { return $status }
              Start-Sleep -Milliseconds 250
            } while ([DateTime]::UtcNow -lt $deadline)
            throw "Yav on port $port did not report version $env:RC_VERSION"
          }
          function Assert-PortReleased([int] $port) {
            $listener = Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object { $_.LocalPort -eq $port }
            if ($listener) { throw "Port $port is still listening" }
          }

          $pageData = Join-Path $env:RUNNER_TEMP 'yav-rc2-page'
          $env:PYTHONPATH = (Get-Location).Path
          python qa/ui_seed.py $pageData
          $pageProcess = Start-Process -FilePath $exe -ArgumentList @('--data-dir', $pageData, '--port', '18772', '--no-browser') -PassThru -WindowStyle Hidden
          try {
            Wait-YavReady 18772 | Out-Null
            $env:BASE_URL = 'http://127.0.0.1:18772'
            npx playwright test qa/ui_full_chain.spec.js --workers=1 --reporter=line
            if (-not $pageProcess.WaitForExit(30000)) { throw 'Page confirmation exit did not stop RC2 EXE' }
            Assert-PortReleased 18772
          } finally {
            if (-not $pageProcess.HasExited) { $pageProcess.Kill($true) }
          }

          $cliData = Join-Path $env:RUNNER_TEMP 'yav-rc2-cli'
          $cliProcess = Start-Process -FilePath $exe -ArgumentList @('--data-dir', $cliData, '--port', '18773', '--no-browser') -PassThru -WindowStyle Hidden
          try {
            Wait-YavReady 18773 | Out-Null
            & $exe --data-dir $cliData --shutdown
            if (-not $cliProcess.WaitForExit(30000)) { throw 'CLI exit did not stop RC2 EXE' }
            Assert-PortReleased 18773
          } finally {
            if (-not $cliProcess.HasExited) { $cliProcess.Kill($true) }
          }

      - name: Create RC2 artifact, SHA256SUMS, and manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'yav-rc2-artifact'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $exeName = 'Yav-V2-2.0.2-RC2.exe'
          $exe = Join-Path $root $exeName
          Copy-Item 'dist\Yav-V2.exe' $exe
          $exeHash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToUpperInvariant()
          $exeSize = (Get-Item $exe).Length
          "$exeHash  $exeName" | Set-Content (Join-Path $root 'SHA256SUMS.txt') -Encoding ascii
          @(
            'product=Yav'
            'version=2.0.2'
            'channel=RC2'
            "source_commit=$env:SOURCE_SHA"
            'source_ref=v2-rebuild merge commit'
            'platform=windows-x64'
            "exe_file=$exeName"
            "exe_size_bytes=$exeSize"
            "exe_sha256=$exeHash"
            'old_rc_status=FAIL; do not release 918574E5FF886DDBCAA41B542C0EE1B40EA12D1C56AA6B136003880AD9B42BAF'
          ) | Set-Content (Join-Path $root 'RC2-MANIFEST.txt') -Encoding ascii
          $zip = Join-Path $root "$env:RC_NAME.zip"
          Compress-Archive -LiteralPath @($exe, (Join-Path $root 'SHA256SUMS.txt'), (Join-Path $root 'RC2-MANIFEST.txt')) -DestinationPath $zip -Force
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToUpperInvariant()
          "$zipHash  $(Split-Path $zip -Leaf)" | Add-Content (Join-Path $root 'SHA256SUMS.txt') -Encoding ascii
          Get-Item $exe, $zip | Select-Object Name, Length
          Get-Content (Join-Path $root 'SHA256SUMS.txt')

      - name: Upload RC2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yav-2.0.2-RC2-da815c1-windows-x64
          path: |
            ${{ runner.temp }}/yav-rc2-artifact/Yav-V2-2.0.2-RC2-da815c1-windows-x64.zip
            ${{ runner.temp }}/yav-rc2-artifact/Yav-V2-2.0.2-RC2.exe
            ${{ runner.temp }}/yav-rc2-artifact/SHA256SUMS.txt
            ${{ runner.temp }}/yav-rc2-artifact/RC2-MANIFEST.txt
          if-no-files-found: error
          retention-days: 14
